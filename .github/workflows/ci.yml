name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm audit --audit-level=high
      - run: pnpm build:release
      - name: Verify published package includes dist
        run: |
          cd packages/yargs-file-commands
          pnpm pack --dry-run | grep -qx 'dist/index.js' || {
            echo "::error::dist/index.js missing from the packed tarball; the publish step would ship a broken package."
            exit 1
          }
      - name: Package size gate
        run: pnpm size | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  policy:
    name: PR policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate PR routing and issue link
        run: node scripts/check-pr.mjs
      - name: Validate title and commits
        if: github.base_ref == 'main'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
          # Existing local history predates commitlint adoption. Do not rewrite it.
          LEGACY_HEAD=09abc19b58f242dd016fe5be869c14a6efa0423b
          if git merge-base --is-ancestor "$BASE_SHA" "$LEGACY_HEAD"; then
            BASE_SHA="$LEGACY_HEAD"
          fi
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
