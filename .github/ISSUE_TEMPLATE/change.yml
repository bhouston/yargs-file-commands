name: Change request
description: Propose a feature, fix, or maintenance change.
title: ''
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should change and why?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Compatibility, scope, and other requirements.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes as a checklist.
    validations:
      required: true
